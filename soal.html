<head>
<meta charset="UTF-8">

<title>Soal | MathLab</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    text-decoration: none;
    color: #2563eb;
    font-size: 22px;
    font-weight: 800;
}

.nav-links {
    display: flex;
    gap: 28px;
}

.nav-links a {
    text-decoration: none;
    color: #374151;
    font-weight: 600;
}

.nav-links a:hover {
    color: #2563eb;
}

.page {
    max-width: 900px;
    margin: auto;
    padding: 45px 20px 80px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.badge {
    display: inline-block;
    background: #e8f0ff;
    color: #2563eb;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.header h1 {
    margin: 14px 0 8px;
    font-size: 40px;
}

.header p {
    color: #6b7280;
}

.progress-area {
    margin-bottom: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 9px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 5%;
    background: #2563eb;
    transition: width .3s;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,.05);
}

.question-number {
    display: inline-block;
    background: #eff6ff;
    color: #2563eb;
    font-weight: bold;
    padding: 7px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
}

.question {
    font-size: 21px;
    line-height: 1.7;
    margin-bottom: 22px;
}

.math {
    font-family: "Times New Roman", serif;
    font-size: 23px;
}

.diagram {
    text-align: center;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px;
    margin: 20px 0;
    overflow-x: auto;
}

.diagram svg {
    max-width: 100%;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    border: 2px solid #e5e7eb;
    background: white;
    border-radius: 11px;
    padding: 15px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: .2s;
}

.answer:hover {
    border-color: #2563eb;
    background: #f8fbff;
}

.answer.correct {
    border-color: #16a34a;
    background: #dcfce7;
}

.answer.wrong {
    border-color: #dc2626;
    background: #fee2e2;
}

.answer.locked {
    cursor: default;
}

.feedback {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.5;
}

.feedback.show {
    display: block;
}

.feedback.correct {
    background: #dcfce7;
    color: #166534;
}

.feedback.wrong {
    background: #fee2e2;
    color: #991b1b;
}

.solution {
    margin-top: 20px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.solution summary {
    cursor: pointer;
    padding: 15px;
    background: #f8fafc;
    font-weight: bold;
}

.solution-content {
    padding: 18px;
    line-height: 1.7;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 25px;
}

.nav-btn {
    padding: 13px 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.prev {
    background: #e5e7eb;
    color: #374151;
}

.next {
    background: #2563eb;
    color: white;
}

.nav-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.result {
    display: none;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 45px 25px;
    text-align: center;
}

.result.show {
    display: block;
}

.result-score {
    font-size: 58px;
    font-weight: 800;
    color: #2563eb;
    margin: 20px;
}

.restart {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 24px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width:700px) {
    .navbar {
        padding: 0 20px;
    }

    .nav-links {
        gap: 12px;
        font-size: 13px;
    }

    .header h1 {
        font-size: 32px;
    }

    .card {
        padding: 22px;
    }

    .question {
        font-size: 18px;
    }

    .navigation {
        flex-direction: column;
    }

    .nav-btn {
        width: 100%;
    }
}
</style>
</head>

    diagram: `
        <svg width="260" height="190" viewBox="0 0 260 190">
            <polygon points="50,55 150,35 205,68 105,88"
                fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
            <polygon points="50,55 105,88 105,160 50,127"
                fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
            <polygon points="105,88 205,68 205,140 105,160"
                fill="#93c5fd" stroke="#2563eb" stroke-width="3"/>
            <text x="120" y="32" font-size="16">s = ?</text>
        </svg>
    `,

    answers: [
        "7 cm",
        "8 cm",
        "9 cm",
        "10 cm"
    ],

    correct: 2,

    explanation: `
        <b>Jawaban: C. 9 cm</b><br><br>

        <span class="math">
        V = s³
        </span>
        <br><br>

        <span class="math">
        s³ = 729
        </span>.
        <br><br>

        Karena:
        <span class="math">9³ = 729</span>,
        maka <b>s = 9 cm</b>.
    `
},

{
    question: `
        Sebuah bola mempunyai diameter 14 cm.
        Gunakan π = 22/7.
        Berapakah volumenya?
    `,

    answers: [
        "1.232 cm³",
        "1.437,33 cm³",
        "1.540 cm³",
        "1.848 cm³"
    ],

    correct: 1,

    explanation: `
        <b>Jawaban: B. 1.437,33 cm³</b><br><br>

        Diameter = 14 cm, sehingga:
        <span class="math">r = 7 cm</span>.
        <br><br>

        <span class="math">
        V = 4/3 πr³
        </span>
        <br><br>

        <span class="math">
        V = 4/3 × 22/7 × 7³
        = 4312/3
        ≈ 1.437,33 cm³
        </span>.
    `
},

{
    question: `
        Nilai dari
        <span class="math">
        3√2 + 5√2 − 2√2
        </span>
        adalah...
    `,

    answers: [
        "4√2",
        "5√2",
        "6√2",
        "10√2"
    ],

    correct: 2,

    explanation: `
        <b>Jawaban: C. 6√2</b><br><br>

        Karena bentuk akarnya sama, jumlahkan koefisien:
        <br>
        <span class="math">
        (3 + 5 − 2)√2
        = 6√2
        </span>.
    `
},

{
    question: `
        Bentuk baku yang benar dari
        <span class="math">4.500.000</span>
        adalah...
    `,

    answers: [
        "4,5 × 10⁵",
        "4,5 × 10⁶",
        "45 × 10⁵",
        "0,45 × 10⁷"
    ],

    correct: 1,

    explanation: `
        <b>Jawaban: B. 4,5 × 10⁶</b><br><br>

        Bentuk baku harus memiliki angka depan
        minimal 1 dan kurang dari 10.
        <br><br>

        Jadi:
        <span class="math">
        4.500.000 = 4,5 × 10⁶
        </span>.
    `
}

];


/* =====================================================
   STATE QUIZ
===================================================== */

let currentQuestion = 0;
let score = 0;

/*
   Ini penting:
   Setiap soal mempunyai statusnya sendiri.

   answeredQuestions[i] = apakah soal i sudah dijawab
   solutionViewedQuestions[i] = apakah pembahasan soal i pernah dibuka
*/

let answeredQuestions =
    new Array(questions.length).fill(false);

let solutionViewedQuestions =
    new Array(questions.length).fill(false);

let selectedAnswers =
    new Array(questions.length).fill(null);


/* =====================================================
   TAMPILKAN SOAL
===================================================== */

function showQuestion() {

    const q = questions[currentQuestion];

    const container =
        document.getElementById("questionContainer");

    let diagram = "";

    if (q.diagram) {
        diagram = `
            <div class="diagram">
                ${q.diagram}
            </div>
        `;
    }

    const alreadyAnswered =
        answeredQuestions[currentQuestion];

    container.innerHTML = `

        <div class="card">

            <div class="question-number">
                Soal ${currentQuestion + 1} dari ${questions.length}
            </div>

            <div class="question">
                ${q.question}
            </div>

            ${diagram}

            <div class="answers">

                ${q.answers.map((answer, i) => {

                    let className = "answer";

                    if (alreadyAnswered) {

                        className += " locked";

                        if (i === q.correct) {
                            className += " correct";
                        }

                        if (
                            i === selectedAnswers[currentQuestion] &&
                            i !== q.correct
                        ) {
                            className += " wrong";
                        }
                    }

                    return `
                        <button
                            class="${className}"
                            onclick="selectAnswer(${i})"
                            ${alreadyAnswered ? "disabled" : ""}>

                            <b>${String.fromCharCode(65+i)}.</b>
                            ${answer}

                        </button>
                    `;

                }).join("")}

            </div>

            <div
                id="feedback"
                class="feedback
                ${alreadyAnswered ? "show" : ""}">

                ${
                    alreadyAnswered
                    ? getPreviousFeedback()
                    : ""
                }

            </div>

            <details
                class="solution"
                id="solutionDetails"
                ontoggle="solutionOpened()">

                <summary>
                    ▶ Jawaban & Pembahasan
                </summary>

                <div class="solution-content">
                    ${q.explanation}
                </div>

            </details>

            <div class="navigation">

                <button
                    class="nav-btn prev"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0 ? "disabled" : ""}>

                    ← Sebelumnya

                </button>

                <button
                    class="nav-btn next"
                    onclick="nextQuestion()">

                    ${
                        currentQuestion === questions.length - 1
                        ? "Selesai ✓"
                        : "Soal Berikutnya →"
                    }

                </button>

            </div>

        </div>
    `;

    updateProgress();
}


/* =====================================================
   FEEDBACK SAAT KEMBALI KE SOAL
===================================================== */

function getPreviousFeedback() {

    const selected =
        selectedAnswers[currentQuestion];

    if (selected === null) return "";

    if (selected === questions[currentQuestion].correct) {

        if (solutionViewedQuestions[currentQuestion]) {

            return `
                ✓ Jawaban benar, tetapi soal ini
                tidak mendapat poin karena pembahasan
                sudah dibuka.
            `;
        }

        return "✓ Benar! +1 poin.";
    }

    return `
        ✗ Jawaban belum tepat.
        Jawaban benar ditandai hijau.
    `;
}


/* =====================================================
   PEMBAHASAN DIBUKA
===================================================== */

function solutionOpened() {

    const solution =
        document.getElementById("solutionDetails");

    if (solution && solution.open) {

        solutionViewedQuestions[currentQuestion] = true;

    }
}


/* =====================================================
   PILIH JAWABAN
===================================================== */

function selectAnswer(index) {

    /*
       Anti infinite score:
       Kalau sudah dijawab, langsung hentikan.
    */

    if (answeredQuestions[currentQuestion]) {

        const feedback =
            document.getElementById("feedback");

        feedback.innerHTML =
            "⚠️ Soal ini sudah dijawab. " +
            "Kamu tidak bisa mendapatkan poin lagi.";

        feedback.classList.add(
            "show",
            "wrong"
        );

        return;
    }


    const q =
        questions[currentQuestion];


    /*
       Tandai soal sudah dijawab
    */

    answeredQuestions[currentQuestion] = true;

    selectedAnswers[currentQuestion] = index;


    const buttons =
        document.querySelectorAll(".answer");

    const feedback =
        document.getElementById("feedback");


    /* ===============================
       JAWABAN BENAR
    =============================== */

    if (index === q.correct) {

        buttons[index].classList.add("correct");


        /*
           Kalau pembahasan sudah dibuka,
           TIDAK dapat poin.
        */

        if (
            solutionViewedQuestions[currentQuestion]
        ) {

            feedback.innerHTML =
                "✓ Jawaban benar, tetapi <b>0 poin</b> " +
                "karena pembahasan sudah dibuka.";

            feedback.classList.add(
                "show",
                "correct"
            );

        } else {

            score++;

            feedback.innerHTML =
                "✓ <b>Benar! +1 poin.</b>";

            feedback.classList.add(
                "show",
                "correct"
            );
        }

    }

    /* ===============================
       JAWABAN SALAH
    =============================== */

    else {

        buttons[index].classList.add("wrong");

        buttons[q.correct]
            .classList.add("correct");

        feedback.innerHTML =
            "✗ Jawaban belum tepat. " +
            "Jawaban yang benar ditandai hijau.";

        feedback.classList.add(
            "show",
            "wrong"
        );
    }


    /*
       Kunci semua tombol
    */

    buttons.forEach(button => {
        button.disabled = true;
        button.classList.add("locked");
    });


    updateProgress();
}


/* =====================================================
   SOAL BERIKUTNYA
===================================================== */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();
    }
}


/* =====================================================
   SOAL SEBELUMNYA
===================================================== */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    const percentage =
        ((currentQuestion + 1) /
        questions.length) * 100;

    document.getElementById("progressFill")
        .style.width =
        percentage + "%";

    document.getElementById("progressText")
        .textContent =
        `Soal ${currentQuestion + 1} dari ${questions.length}`;

    document.getElementById("scoreText")
        .textContent =
        `Skor: ${score}`;
}


/* =====================================================
   HASIL
===================================================== */

function showResult() {

    document.getElementById(
        "questionContainer"
    ).style.display = "none";

    document.getElementById(
        "progressArea"
    ).style.display = "none";


    const result =
        document.getElementById("resultScreen");

    result.classList.add("show");


    const percentage =
        Math.round(
            score / questions.length * 100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `${score}/${questions.length}`;


    let message;


    if (percentage >= 90) {

        message =
            "🔥 Luar biasa! Pemahamanmu sangat bagus.";

    } else if (percentage >= 75) {

        message =
            "👏 Bagus! Tinggal sedikit lagi.";

    } else if (percentage >= 60) {

        message =
            "👍 Lumayan! Pelajari kembali soal yang salah.";

    } else {

        message =
            "💪 Jangan menyerah! Coba pelajari pembahasannya lagi.";

    }


    document.getElementById(
        "finalMessage"
    ).textContent =
        `${percentage}% — ${message}`;
}


/* =====================================================
   ULANGI QUIZ
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;


    /*
       Reset semua status.
       Jadi hanya tombol "Ulangi Latihan"
       yang boleh memberikan kesempatan baru.
    */

    answeredQuestions =
        new Array(questions.length).fill(false);

    solutionViewedQuestions =
        new Array(questions.length).fill(false);

    selectedAnswers =
        new Array(questions.length).fill(null);


    document.getElementById(
        "questionContainer"
    ).style.display = "block";

    document.getElementById(
        "progressArea"
    ).style.display = "block";

    document.getElementById(
        "resultScreen"
    ).classList.remove("show");


    showQuestion();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
   MULAI
===================================================== */

showQuestion();

</script>
