<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS utama website -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           HALAMAN SOAL
        ========================================= */

        .question-page {
            min-height: 100vh;
            padding: 55px 20px 80px;
            background: #f8fafc;
        }

        .question-header {
            max-width: 900px;
            margin: 0 auto 30px;
            text-align: center;
        }

        .question-header h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .question-header p {
            color: #6b7280;
            line-height: 1.6;
        }

        .hero-label {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eaf1ff;
            color: #2563eb;
            font-size: 13px;
            font-weight: bold;
        }

        /* Progress */

        .progress-container {
            max-width: 850px;
            margin: 0 auto 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 5%;
            background: #2563eb;
            transition: width 0.3s;
        }

        /* Question card */

        .question-container {
            max-width: 850px;
            margin: auto;
        }

        .question-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .question-number {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 21px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        /* Math */

        .math {
            font-family: "Times New Roman", serif;
            font-size: 23px;
        }

        /* Diagram */

        .diagram {
            margin: 20px auto 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            overflow-x: auto;
        }

        .diagram svg {
            max-width: 100%;
            height: auto;
        }

        .diagram-caption {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        /* Answers */

        .answers {
            display: grid;
            gap: 12px;
        }

        .answer {
            width: 100%;
            padding: 15px 18px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 11px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #2563eb;
            background: #f8fbff;
        }

        .answer.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .answer.correct {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .answer.wrong {
            border-color: #dc2626;
            background: #fef2f2;
        }

        /* Feedback */

        .feedback {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-feedback {
            background: #dcfce7;
            color: #166534;
        }

        .feedback.wrong-feedback {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Pembahasan */

        .solution {
            margin-top: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .solution summary {
            padding: 15px 18px;
            cursor: pointer;
            font-weight: bold;
            background: #f8fafc;
        }

        .solution-content {
            padding: 18px;
            line-height: 1.7;
            color: #374151;
        }

        .solution-content strong {
            color: #111827;
        }

        /* Navigation */

        .question-navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .nav-button {
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .previous-button {
            background: #e5e7eb;
            color: #374151;
        }

        .next-button {
            background: #2563eb;
            color: white;
        }

        .next-button:hover {
            background: #1d4ed8;
        }

        /* Result */

        .result-screen {
            display: none;
            text-align: center;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .result-screen.show {
            display: block;
        }

        .result-score {
            font-size: 55px;
            font-weight: bold;
            color: #2563eb;
            margin: 20px;
        }

        .restart-button {
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .question-header h1 {
                font-size: 34px;
            }

            .question-card {
                padding: 22px;
            }

            .question-text {
                font-size: 18px;
            }

            .question-navigation {
                flex-direction: column;
            }

            .nav-button {
                width: 100%;
            }
        }
    </style>
</head>

<script>

/* =====================================================
   BANK SOAL KELAS 9

const questions = [

    {
        question: `
            Diketahui:
            <span class="math">a³ × b³</span>.
            Bentuk yang setara adalah...
        `,

        answers: [
            "(ab)²",
            "(ab)³",
            "a³ + b³",
            "a + b³"
        ],

        correct: 1,

        explanation: `
            <strong>Jawaban: B. (ab)³</strong><br><br>

            Gunakan sifat perpangkatan:
            <br>
            <span class="math">aⁿ × bⁿ = (ab)ⁿ</span>
            <br><br>

            Jadi:
            <br>
            <span class="math">a³ × b³ = (ab)³</span>
        `
    },


    {
        question: `
            Hasil dari
            <span class="math">(2/3)<sup>−2</sup></span>

        answers: [
            "−4/9",
            "−9/4",
            "9/4",
            "4/9"
        ],

        correct: 2,

        explanation: `
            <strong>Jawaban: C. 9/4</strong><br><br>

            Pangkat negatif berarti membalik pecahan:
            <br>
            <span class="math">(2/3)<sup>−2</sup>
            = (3/2)²</span>
            <br><br>

            Kemudian:
            <br>
            <span class="math">3²/2² = 9/4</span>
        `
    },


    {
        question: `
            Hasil dari
            <span class="math">
            (3³ × 6³) ÷ 9²

            adalah...

        answers: [
            "144",
            "72",
            "36",
            "18"

        correct: 1,

        explanation: `
            <strong>Jawaban: B. 72</strong><br><br>

            Gabungkan pangkat:
            <br>
            <span class="math">
            3³ × 6³ = (3 × 6)³ = 18³
            </span>
            <br><br>

            Jadi:
            <br>
            <span class="math">
            18³ ÷ 9²
            = 5832 ÷ 81
            = 72
            </span>
        `
    },


    {
        question: `
            Hasil dari
            <span class="math">
            5<sup>−2</sup> + 5<sup>−1</sup>

        ],

            <span class="math">

            <br>
            <span class="math">
            1/25 + 1/5 + 1 + 5 + 25

            <br><br>

            <span class="math">
            = 31 + 6/25

            </span>

    },


    {
        question: `

            <span class="math">2<sup>m</sup> = 32</span>
            dan
            <span class="math">2<sup>n</sup> = 8</span>,
            maka nilai <span class="math">m + n</span> adalah...

            "5",

            "8",

        correct: 2,

        explanation: `
            <strong>Jawaban: C. 8</strong><br><br>

            Karena:
            <br>
            <span class="math">32 = 2⁵</span>,
            maka <span class="math">m = 5</span>.
            <br><br>

            <span class="math">8 = 2³</span>,
            maka <span class="math">n = 3</span>.
            <br><br>

            Jadi:
            <br>
            <span class="math">m + n = 5 + 3 = 8</span>
        `
    },


    {

            <span class="math">x<sup>−3</sup></span>

            Sifat pangkat negatif:
            <br>
            <span class="math">
            x<sup>−n</sup> = 1/xⁿ
            </span>
            <br><br>

            Jadi:
            <br>
            <span class="math">
            x<sup>−3</sup> = 1/x³
            </span>
        `
    },


    {
        question: `
            Bentuk paling sederhana dari
            <span class="math">
            3<sup>2m+5</sup> ÷ 3<sup>m+2</sup>
            </span>
            adalah...

        answers: [

        correct: 1,

        explanation: `
            <strong>Jawaban: B. 3<sup>m+3</sup></strong><br><br>

            Jika basis sama dan dibagi, pangkat dikurangkan:
            <br>
            <span class="math">
            3<sup>2m+5</sup> ÷ 3<sup>m+2</sup>

            3<sup>(2m+5)−(m+2)</sup>

            <br><br>

            <span class="math">
            = 3<sup>m+3</sup>
            </span>
        `
    },


    {
        question: `
            Bentuk sederhana dari
            <span class="math">√108</span>

            </span>
        `
    },


    {
        question: `
            Hasil dari
            <span class="math">

        answers: [

            "9√2",
            "10√2"
        ],

        correct: 0,

        explanation: `
            <strong>Jawaban: A. 7√2</strong><br><br>

            <span class="math">
            √50 = √25×2 = 5√2
            </span>
            <br>
            <span class="math">
            √8 = √4×2 = 2√2
            </span>
            <br><br>

            Jadi:
            <br>
            <span class="math">
            5√2 + 2√2 = 7√2
            </span>
        `
    },


    {
        question: `
            Hasil dari
            <span class="math">
            √80 − 3√45 + 3√5

            adalah...
        `,

        answers: [

            "−2√5",

            <br>
            <span class="math">√80 = 4√5</span>
            <br>
            <span class="math">√45 = 3√5</span>
            <br><br>

            Maka:
            <br>
            <span class="math">
            4√5 − 3(3√5) + 3√5
            </span>
            <br>
            <span class="math">
            = 4√5 − 9√5 + 3√5
            = −2√5
            </span>
        `
    },


    {
        question: `
            Bentuk akar dari
            <span class="math">2<sup>3/2</sup></span>
            adalah...
        `,

        answers: [
            "2√2",
            "3√2",
            "√2/2",
            "√3/2"
        ],

        correct: 0,

        explanation: `
            <strong>Jawaban: A. 2√2</strong><br><br>

            Gunakan:
            <br>
            <span class="math">
            a<sup>m/n</sup> = ⁿ√(aᵐ)
            </span>
            <br><br>

            Jadi:
            <br>
            <span class="math">
            2<sup>3/2</sup>
            = √(2³)
            = √8
            = 2√2
            </span>
        `
    },


    {
        question: `
            Bentuk baku dari
            <span class="math">0,00078</span>
            adalah...
        `,

        answers: [

        correct: 1,

        explanation: `
            <strong>Jawaban: B. 7,8 × 10⁻⁴</strong><br><br>

            Geser koma 4 tempat ke kanan:
            <br>
            <span class="math">
            0,00078 → 7,8
            </span>
            <br><br>

            Karena koma digeser ke kanan 4 tempat,
            pangkat 10 menjadi −4.
            <br><br>

            Jadi:
            <br>
            <span class="math">
            0,00078 = 7,8 × 10⁻⁴
            </span>
        `
    },


    {
        question: `
            Sebuah kubus memiliki panjang rusuk
            <span class="math">6 cm</span>.
            Berapakah luas permukaannya?
        `,

        diagram: `
            <svg width="300" height="210" viewBox="0 0 300 210">
                <polygon points="80,60 180,35 235,70 135,95"
                    fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
                <polygon points="80,60 135,95 135,175 80,140"
                    fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>

            </div>

        answers: [
            "36 cm²",
            "72 cm²",
            "216 cm²",
            "324 cm²"

        correct: 2,

        explanation: `
            <strong>Jawaban: C. 216 cm²</strong><br><br>

            Luas permukaan kubus:
            <br>
            <span class="math">
            L = 6s²
            </span>
            <br><br>

            Dengan <span class="math">s = 6</span>:
            <br>
            <span class="math">
            L = 6 × 6²
            = 6 × 36
            = 216 cm²
            </span>
        `
    },


    {
        question: `
            Sebuah balok memiliki panjang

    {
        question: `

        diagram: `

/* =====================================================
   VARIABEL
===================================================== */

let currentQuestion = 0;
let score = 0;
let answered = false;
let solutionViewed = false;


/* =====================================================
   MENAMPILKAN SOAL
===================================================== */

function showQuestion() {

    const question = questions[currentQuestion];

    const container =
        document.getElementById("questionContainer");

    answered = false;
    solutionViewed = false;

    let diagramHTML = "";

    if (question.diagram) {
        diagramHTML = `
            <div class="diagram">
                ${question.diagram}
            </div>
        `;
    }

    container.innerHTML = `

        <div class="question-card">

            <div class="question-number">
                Soal ${currentQuestion + 1} dari ${questions.length}
            </div>

            <div class="question-text">
                ${question.question}
            </div>

            ${diagramHTML}

            <div class="answers">

                ${question.answers.map((answer, index) => `

                    <button
                        class="answer"
                        onclick="selectAnswer(${index})">

                        <strong>
                            ${String.fromCharCode(65 + index)}.
                        </strong>

                        ${answer}

                    </button>

                `).join("")}

            </div>

            <div
                id="feedback"
                class="feedback">
            </div>

            <details class="solution" id="solutionDetails"
                ontoggle="solutionOpened()">

                <summary>
                    ▶ Jawaban & Pembahasan
                </summary>

                <div class="solution-content">

                    ${question.explanation}

                </div>

            </details>

            <div class="question-navigation">

                <button
                    class="nav-button previous-button"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0 ? "disabled" : ""}>

                    ← Sebelumnya

                </button>

                <button
                    class="nav-button next-button"
                    onclick="nextQuestion()">

                    ${currentQuestion === questions.length - 1
                        ? "Selesai ✓"
                        : "Soal Berikutnya →"}

                </button>

            </div>

        </div>

    `;

    updateProgress();
}
function solutionOpened() {

    const solution =
        document.getElementById("solutionDetails");

    if (solution.open) {

        solutionViewed = true;

    }

}

/* =====================================================
   PILIH JAWABAN
===================================================== */

    
function selectAnswer(index) {

    if (answered) return;

    answered = true;

    const question = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    const feedback =
        document.getElementById("feedback");

if (index === question.correct) {

    buttons[index].classList.add("correct");

    if (solutionViewed) {

        feedback.textContent =
            "✓ Jawaban benar, tetapi poin tidak diberikan karena pembahasan sudah dibuka.";

        feedback.classList.add(
            "show",
            "correct-feedback"
        );

    } else {

        feedback.textContent =
            "✓ Benar! +1 poin.";

        feedback.classList.add(
            "show",
            "correct-feedback"
        );

        score++;

    }

}

    } else {

        buttons[index].classList.add("wrong");

        buttons[question.correct]
            .classList.add("correct");

        feedback.innerHTML =
            "✗ Jawaban belum tepat. " +
            "Lihat jawaban yang benar pada pilihan yang ditandai.";

        feedback.classList.add(
            "show",
            "wrong-feedback"
        );
    }

    document.getElementById("scoreText").textContent =
        `Skor: ${score}`;

}


/* =====================================================
   SOAL BERIKUTNYA
===================================================== */

function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();

    }

}


/* =====================================================
   SOAL SEBELUMNYA
===================================================== */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    const percentage =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progressFill")
        .style.width = percentage + "%";

    document.getElementById("progressText")
        .textContent =
        `Soal ${currentQuestion + 1} dari ${questions.length}`;

    document.getElementById("scoreText")
        .textContent =
        `Skor: ${score}`;

}


/* =====================================================
   HASIL AKHIR
===================================================== */

function showResult() {

    document.getElementById("questionContainer")
        .style.display = "none";

    document.querySelector(".progress-container")
        .style.display = "none";

    const result =
        document.getElementById("resultScreen");

    result.classList.add("show");

    document.getElementById("finalScore")
        .textContent =
        `${score}/${questions.length}`;

    const percentage =
        Math.round(
            score / questions.length * 100
        );

    let message = "";

    if (percentage >= 90) {

        message =
            "🔥 Luar biasa! Penguasaan materimu sangat bagus.";

    } else if (percentage >= 75) {

        message =
            "👏 Bagus! Tinggal sedikit lagi untuk lebih sempurna.";

    } else if (percentage >= 60) {

        message =
            "👍 Lumayan! Coba pelajari kembali soal yang salah.";

    } else {

        message =
            "💪 Jangan menyerah! Pelajari pembahasannya dan coba lagi.";

    }

    document.getElementById("finalMessage")
        .textContent =
        `${percentage}% — ${message}`;

}


/* =====================================================
   ULANGI
===================================================== */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("questionContainer")
        .style.display = "block";

    document.querySelector(".progress-container")
        .style.display = "block";

    document.getElementById("resultScreen")
        .classList.remove("show");

    showQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   MULAI
===================================================== */

showQuestion();

</script>
